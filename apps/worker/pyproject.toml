[project]
name = "worker"
version = "0.1.0"
description = "Celery workers (discovery, crawl, extraction, enrichment, dedup, geo, scoring, indexing, scheduled) for the India Real Estate Intelligence Platform"
requires-python = ">=3.13"
dependencies = [
    "corelib",
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
corelib = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
