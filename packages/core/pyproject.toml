[project]
name = "corelib"
version = "0.1.0"
description = "Shared SQLAlchemy models, enums, and schemas for the India Real Estate Intelligence Platform"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9",
    "pgvector>=0.3.6",
    "geoalchemy2>=0.15.2",
    "asyncpg>=0.30",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corelib"]
